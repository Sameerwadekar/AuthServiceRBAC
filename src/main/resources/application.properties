spring.application.name=auth-service

spring.datasource.url=jdbc:mysql://localhost:3306/workflow-auth?createDatabaseIfNotExist=true
spring.datasource.username=sameer
spring.datasource.password=Sameer@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.security.user.name=admin
spring.security.user.password=admin


spring.app.jwtExpirationMs=900000
spring.app.refreshExpirationMs=604800000
spring.app.jwtCookieName=accessToken
spring.app.jwtRefreshCookieName=refreshToken

spring.app.jwt.private-key-path=keys/private.pem
spring.app.jwt.public-key-path=keys/public.pem
spring.app.jwt.key-id=auth-key-001
spring.app.jwt.issuer=http://localhost:8080

